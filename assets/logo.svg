<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Concentric rings with one point standing out" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- outer dashed ring, very slow drift -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#2a3430" stroke-width="1.5" stroke-dasharray="2 7">
    <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="90s" repeatCount="indefinite"/>
  </circle>
  <!-- quiet rings -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#33403b" stroke-width="1"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#3a4642" stroke-width="1"/>
  <circle cx="60" cy="60" r="2" fill="#5b6b66"/>
  <!-- the one that stands out: shows up on the same 10s cycle as the banner's "that's odd" line -->
  <circle cx="84" cy="42" r="3.5" fill="none" stroke="#7ee2b8" stroke-width="1" opacity="0">
    <animate attributeName="r" values="3.5;3.5;16;16" keyTimes="0;0.63;0.82;1" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.63;0.82;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="42" r="3.5" fill="#7ee2b8" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.92;1" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
