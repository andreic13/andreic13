<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-label="Log lines: nothing to report, nothing to report, nothing to report, that's odd." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg   { fill: #0d1117; }
    .t    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; fill: #5b6b66; opacity: 0; }
    .ts   { fill: #3a4642; }
    .odd  { fill: #7ee2b8; }
    .cur  { fill: #7ee2b8; animation: blink 1s steps(1) infinite; }
    #l1 { animation: l1 10s infinite; }
    #l2 { animation: l2 10s infinite; }
    #l3 { animation: l3 10s infinite; }
    #l4 { animation: l4 10s infinite; }
    @keyframes l1 { 0%,4%{opacity:0} 8%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l2 { 0%,18%{opacity:0} 22%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l3 { 0%,32%{opacity:0} 36%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l4 { 0%,58%{opacity:0} 63%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
  <rect class="bg" width="800" height="190" rx="14"/>
  <g transform="translate(40,52)">
    <text id="l1" class="t" x="0" y="0"><tspan class="ts">03:12:07</tspan>  nothing to report</text>
    <text id="l2" class="t" x="0" y="34"><tspan class="ts">03:12:08</tspan>  nothing to report</text>
    <text id="l3" class="t" x="0" y="68"><tspan class="ts">03:12:09</tspan>  nothing to report</text>
    <text id="l4" class="t odd" x="0" y="102"><tspan class="ts">03:12:09</tspan>  <tspan class="odd">hm. that's odd.</tspan></text>
    <rect class="cur" x="0" y="118" width="10" height="3"/>
  </g>
</svg>
