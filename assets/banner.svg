<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Log lines: nothing to report, nothing to report, nothing to report, that's odd.">
  <style>
    .bg   { fill: #0d1117; }
    .t    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 22px; fill: #c9c2bb; fill-opacity: 0.6; opacity: 0; }
    .ts   { fill: #c9c2bb; fill-opacity: 0.3; }
    .odd  { fill: #c71f3a; fill-opacity: 1; }
    .cur  { fill: #c71f3a; animation: blink 1s steps(1) infinite; }
    #l1 { animation: l1 10s infinite; }
    #l2 { animation: l2 10s infinite; }
    #l3 { animation: l3 10s infinite; }
    #l4 { animation: l4 10s infinite; }
    @keyframes l1 { 0%,4%{opacity:0} 8%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l2 { 0%,18%{opacity:0} 22%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l3 { 0%,32%{opacity:0} 36%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes l4 { 0%,58%{opacity:0} 63%,92%{opacity:1} 97%,100%{opacity:0} }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>
  <rect class="bg" width="800" height="240" rx="14"/>
  <g transform="translate(40,56)">
    <text id="l1" class="t" x="0" y="0"><tspan class="ts">03:12:07</tspan>  nothing to report</text>
    <text id="l2" class="t" x="0" y="42"><tspan class="ts">03:12:08</tspan>  nothing to report</text>
    <text id="l3" class="t" x="0" y="84"><tspan class="ts">03:12:09</tspan>  nothing to report</text>
    <text id="l4" class="t odd" x="0" y="126"><tspan class="ts">03:12:09</tspan>  <tspan class="odd">hm. that's odd.</tspan></text>
    <rect class="cur" x="0" y="142" width="13" height="4"/>
  </g>
  <!-- logo, right side: 150px (120 * 1.25), vertically centered in 240px -->
  <g transform="translate(610,45) scale(1.25)">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#7a1226" stroke-width="1.5" stroke-dasharray="2 7">
      <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="90s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="60" r="38" fill="none" stroke="#c9c2bb" stroke-opacity="0.25" stroke-width="1"/>
    <circle cx="60" cy="60" r="22" fill="none" stroke="#c9c2bb" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="60" cy="60" r="2" fill="#c9c2bb"/>
    <circle cx="84" cy="42" r="3.5" fill="none" stroke="#c71f3a" stroke-width="1" opacity="0">
      <animate attributeName="r" values="3.5;3.5;16;16" keyTimes="0;0.63;0.82;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0;0" keyTimes="0;0.63;0.82;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="84" cy="42" r="3.5" fill="#c71f3a" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
